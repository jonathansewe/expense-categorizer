# CI: runs on every push and pull request. A red job blocks the merge
# (once branch protection requires it). SPEC 11.2.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # Throwaway PostgreSQL, deleted when the job ends.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sewe
          POSTGRES_PASSWORD: sewe
          POSTGRES_DB: sewe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sewe -d sewe_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sewe:sewe@localhost:5432/sewe_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  api-image:
    name: API Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sewe-finance-api:ci api

  app:
    name: App (eslint, tsc, jest, i18n, exercises)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes the i18n key-parity test (tests/i18n-parity.test.ts).
      - run: npm test -- --ci
      # Exercise tests against the reference solutions (SPEC 12.2).
      - run: npm run test:exercises -- --ci

  legacy:
    name: Legacy P1 script still runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd legacy && python3 categorize.py
